<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="2300" viewBox="0 0 1600 2300">
  <defs>
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto">
      <path d="M2,2 L12,7 L2,12 Z" fill="#111827"/>
    </marker>
    <style>
      text { font-family: Arial, Helvetica, sans-serif; fill: #111827; }
      .page-title { font-size: 72px; font-weight: 800; letter-spacing: 0; }
      .page-sub { font-size: 25px; fill: #526070; }
      .scope { fill: #d9f2df; stroke: none; rx: 30; }
      .block { fill: #ffffff; stroke: #111827; stroke-width: 4; rx: 16; }
      .head { fill: #22a95a; stroke: #111827; stroke-width: 4; rx: 16; }
      .head-flat { fill: #22a95a; stroke: #111827; stroke-width: 4; }
      .head-text { fill: #ffffff; font-size: 33px; font-weight: 800; }
      .body-title { font-size: 35px; font-weight: 800; }
      .body-text { font-size: 23px; fill: #263238; }
      .small { font-size: 20px; fill: #3d4e57; }
      .muted { font-size: 20px; fill: #64748b; }
      .edge { stroke: #111827; stroke-width: 4; fill: none; marker-end: url(#arrow); }
      .edge-back { stroke: #111827; stroke-width: 4; fill: none; }
      .edge-label { font-size: 22px; fill: #111827; }
      .mini { fill: #edfafa; stroke: #19a99f; stroke-width: 3; rx: 12; }
      .mini-blue { fill: #eef4ff; stroke: #5d82c7; stroke-width: 3; rx: 12; }
      .mini-gold { fill: #fff7e8; stroke: #d79b35; stroke-width: 3; rx: 12; }
      .mini-red { fill: #fff1f2; stroke: #fb7185; stroke-width: 3; rx: 12; }
      .flow-box { fill: #ffffff; stroke: #94a3b8; stroke-width: 3; rx: 18; }
    </style>
  </defs>

  <rect width="1600" height="2300" fill="#f8fafc"/>
  <text class="page-title" x="120" y="135">Previous True Demand</text>
  <text class="page-title" x="120" y="225">KGQA Architecture</text>
  <text class="page-sub" x="125" y="275">Earlier MVP: simpler LLM-to-SPARQL workflow evaluated on the smaller benchmark.</text>

  <!-- User and browser -->
  <rect class="block" x="155" y="365" width="420" height="290"/>
  <path class="head" d="M155 365 H575 V460 H155 Z"/>
  <text class="head-text" x="365" y="425" text-anchor="middle">User</text>
  <circle cx="365" cy="535" r="35" fill="#22a95a" stroke="#111827" stroke-width="4"/>
  <path d="M300 630 C305 570 425 570 430 630 Z" fill="#22a95a" stroke="#111827" stroke-width="4"/>

  <rect class="block" x="1025" y="365" width="420" height="290"/>
  <path class="head" d="M1025 365 H1445 V460 H1025 Z"/>
  <text class="head-text" x="1235" y="425" text-anchor="middle">Web Browser</text>
  <rect x="1107" y="505" width="255" height="125" fill="#ffffff" stroke="#111827" stroke-width="4" rx="8"/>
  <line x1="1107" y1="535" x2="1362" y2="535" stroke="#111827" stroke-width="4"/>
  <circle cx="1130" cy="521" r="5" fill="#111827"/>
  <circle cx="1150" cy="521" r="5" fill="#111827"/>
  <rect x="1129" y="553" width="100" height="58" fill="#22a95a" stroke="#111827" stroke-width="4" rx="4"/>
  <rect x="1245" y="553" width="92" height="24" fill="#f8fafc" stroke="#111827" stroke-width="4" rx="4"/>
  <rect x="1245" y="591" width="92" height="20" fill="#f8fafc" stroke="#111827" stroke-width="4" rx="4"/>

  <path class="edge" d="M620 495 H970"/>
  <path class="edge-back" d="M970 575 H620"/>
  <text class="edge-label" x="725" y="465">asks question</text>
  <text class="edge-label" x="705" y="625">receives forced answer</text>

  <!-- System scope -->
  <rect class="scope" x="90" y="770" width="1420" height="1320"/>
  <text class="body-title" x="585" y="2030">Previous MVP System Scope</text>

  <!-- Top row in scope -->
  <rect class="block" x="165" y="890" width="405" height="280"/>
  <path class="head" d="M165 890 H570 V985 H165 Z"/>
  <text class="head-text" x="367" y="950" text-anchor="middle">Streamlit Prototype</text>
  <text class="body-title" x="220" y="1052">Simple UI</text>
  <text class="body-text" x="220" y="1095">Question input</text>
  <text class="body-text" x="220" y="1130">Example questions</text>
  <text class="body-text" x="220" y="1165">Answer + query display</text>

  <rect class="flow-box" x="655" y="875" width="290" height="325"/>
  <text class="body-title" x="720" y="925">Core Flow</text>
  <rect class="mini" x="695" y="965" width="210" height="58"/>
  <text class="small" x="800" y="1002" text-anchor="middle">Preprocessing</text>
  <rect class="mini-blue" x="695" y="1038" width="210" height="58"/>
  <text class="small" x="800" y="1075" text-anchor="middle">Candidate checks</text>
  <rect class="mini-red" x="695" y="1111" width="210" height="58"/>
  <text class="small" x="800" y="1148" text-anchor="middle">Forced selection</text>

  <rect class="block" x="1030" y="890" width="405" height="280"/>
  <path class="head" d="M1030 890 H1435 V985 H1030 Z"/>
  <text class="head-text" x="1232" y="950" text-anchor="middle">KGQA Pipeline</text>
  <text class="body-title" x="1085" y="1052">Server-side Code</text>
  <text class="body-text" x="1085" y="1095">Python scripts</text>
  <text class="body-text" x="1085" y="1130">Syntax/schema checks</text>
  <text class="body-text" x="1085" y="1165">Semantic selector</text>

  <path class="edge" d="M1235 655 V820"/>
  <path class="edge-back" d="M1295 820 V655"/>
  <text class="edge-label" x="1315" y="745">page request</text>

  <path class="edge" d="M570 1030 H635"/>
  <path class="edge" d="M945 1030 H1030"/>
  <text class="edge-label" x="610" y="1010">request</text>
  <path class="edge-back" d="M1030 1145 H945"/>
  <path class="edge-back" d="M635 1145 H570"/>
  <text class="edge-label" x="690" y="1190">selected candidate</text>

  <!-- Bottom row in scope -->
  <rect class="block" x="165" y="1390" width="405" height="280"/>
  <path class="head" d="M165 1390 H570 V1485 H165 Z"/>
  <text class="head-text" x="367" y="1450" text-anchor="middle">Infineon GPT</text>
  <text class="body-title" x="220" y="1548">LLM Candidate</text>
  <text class="body-title" x="220" y="1588">Generation</text>
  <text class="body-text" x="220" y="1633">Full schema prompt</text>
  <text class="body-text" x="220" y="1668">Top-k SPARQL candidates</text>

  <rect class="flow-box" x="655" y="1405" width="290" height="250"/>
  <text class="body-title" x="708" y="1457">Evaluation</text>
  <rect class="mini-gold" x="695" y="1500" width="210" height="58"/>
  <text class="small" x="800" y="1537" text-anchor="middle">~300 questions</text>
  <rect class="mini-blue" x="695" y="1572" width="210" height="58"/>
  <text class="small" x="800" y="1609" text-anchor="middle">Error analysis</text>

  <rect class="block" x="1030" y="1390" width="405" height="280"/>
  <path class="head" d="M1030 1390 H1435 V1485 H1030 Z"/>
  <text class="head-text" x="1232" y="1450" text-anchor="middle">RDF Graph</text>
  <text class="body-title" x="1085" y="1548">SPARQL Execution</text>
  <text class="body-text" x="1085" y="1593">True Demand RDF graph</text>
  <text class="body-text" x="1085" y="1628">Local RDFLib execution</text>
  <text class="body-text" x="1085" y="1663">Rows / execution errors</text>

  <path class="edge" d="M367 1170 V1340"/>
  <path class="edge-back" d="M445 1340 V1170"/>
  <text class="edge-label" x="195" y="1270">prompt + schema</text>

  <path class="edge" d="M1232 1170 V1340"/>
  <path class="edge-back" d="M1310 1340 V1170"/>
  <text class="edge-label" x="1328" y="1270">selected query</text>

  <path class="edge" d="M570 1532 H635"/>
  <path class="edge" d="M945 1532 H1030"/>
  <text class="edge-label" x="666" y="1482">execution check</text>
  <path class="edge-back" d="M1030 1615 H945"/>
  <path class="edge-back" d="M635 1615 H570"/>
  <text class="edge-label" x="710" y="1668">rows / errors</text>

  <!-- Assets -->
  <rect class="block" x="165" y="1815" width="1270" height="120"/>
  <path class="head-flat" d="M165 1815 H1435 V1875 H165 Z"/>
  <text class="head-text" x="800" y="1856" text-anchor="middle">Stored Assets</text>
  <text class="body-text" x="225" y="1910">Schema JSON</text>
  <text class="body-text" x="445" y="1910">RDF graph file</text>
  <text class="body-text" x="690" y="1910">Smaller benchmark</text>
  <text class="body-text" x="1030" y="1910">Candidate/eval reports</text>

  <text class="muted" x="180" y="2115">Limitations at this stage: always tried to select one answer, simpler ranking, no confidence-aware routing, and less polished clarification UX.</text>
</svg>
