<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900">
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2,2 L10,6 L2,10 Z" fill="#2f3a4a"/>
    </marker>
    <style>
      text { font-family: Arial, Helvetica, sans-serif; fill: #172033; }
      .title { font-size: 34px; font-weight: 700; }
      .sub { font-size: 18px; fill: #526070; }
      .box-title { font-size: 19px; font-weight: 700; }
      .box-text { font-size: 15px; fill: #465466; }
      .box { fill: #ffffff; stroke: #8fa3b8; stroke-width: 2; rx: 10; }
      .store { fill: #f5f8fb; stroke: #8fa3b8; stroke-width: 2; rx: 10; }
      .llm { fill: #fff7e8; stroke: #d79b35; stroke-width: 2; rx: 10; }
      .rank { fill: #edf7f1; stroke: #4d9d69; stroke-width: 2; rx: 10; }
      .out { fill: #eef4ff; stroke: #5d82c7; stroke-width: 2; rx: 10; }
      .arrow { stroke: #2f3a4a; stroke-width: 2.5; fill: none; marker-end: url(#arrow); }
      .dashed { stroke-dasharray: 7 7; }
    </style>
  </defs>

  <rect width="1400" height="900" fill="#fbfcfe"/>
  <text class="title" x="70" y="65">Infineon True Demand KGQA System Architecture</text>
  <text class="sub" x="70" y="95">Natural language question answering over the ontology and RDF knowledge graph</text>

  <rect class="box" x="70" y="160" width="210" height="95"/>
  <text class="box-title" x="95" y="195">User Question</text>
  <text class="box-text" x="95" y="222">Natural language input</text>
  <text class="box-text" x="95" y="243">from business user</text>

  <rect class="box" x="340" y="145" width="250" height="125"/>
  <text class="box-title" x="365" y="182">Preprocessing</text>
  <text class="box-text" x="365" y="210">Canonicalization</text>
  <text class="box-text" x="365" y="232">Entity linking</text>
  <text class="box-text" x="365" y="254">Noisy label handling</text>

  <rect class="llm" x="650" y="145" width="260" height="125"/>
  <text class="box-title" x="675" y="182">LLM Generation</text>
  <text class="box-text" x="675" y="210">Prompt with schema context</text>
  <text class="box-text" x="675" y="232">Generate SPARQL candidates</text>
  <text class="box-text" x="675" y="254">Infineon GPT gateway</text>

  <rect class="box" x="970" y="145" width="280" height="125"/>
  <text class="box-title" x="995" y="182">Candidate Checks</text>
  <text class="box-text" x="995" y="210">Syntax and schema validation</text>
  <text class="box-text" x="995" y="232">Graph execution checks</text>
  <text class="box-text" x="995" y="254">Semantic coverage</text>

  <rect class="rank" x="970" y="345" width="280" height="125"/>
  <text class="box-title" x="995" y="382">Selection and Ranking</text>
  <text class="box-text" x="995" y="410">Rule/schema signals</text>
  <text class="box-text" x="995" y="432">Semantic scoring</text>
  <text class="box-text" x="995" y="454">ML reranker</text>

  <rect class="out" x="650" y="345" width="260" height="125"/>
  <text class="box-title" x="675" y="382">Answer</text>
  <text class="box-text" x="675" y="410">Selected SPARQL query</text>
  <text class="box-text" x="675" y="432">Graph-grounded result</text>
  <text class="box-text" x="675" y="454">Explanation and relevant graph</text>

  <rect class="box" x="340" y="345" width="250" height="125"/>
  <text class="box-title" x="365" y="382">Clarification Layer</text>
  <text class="box-text" x="365" y="410">Ask when intent is ambiguous</text>
  <text class="box-text" x="365" y="432">Still needs improvement for</text>
  <text class="box-text" x="365" y="454">vague pronouns</text>

  <rect class="store" x="70" y="565" width="1180" height="230"/>
  <text class="box-title" x="100" y="605">Stored / Retrieved Context</text>

  <rect class="box" x="105" y="635" width="220" height="100"/>
  <text class="box-title" x="128" y="668">RDF Graph</text>
  <text class="box-text" x="128" y="695">True Demand triples</text>
  <text class="box-text" x="128" y="717">Executed by SPARQL</text>

  <rect class="box" x="370" y="635" width="220" height="100"/>
  <text class="box-title" x="393" y="668">Ontology Schema</text>
  <text class="box-text" x="393" y="695">Classes, predicates</text>
  <text class="box-text" x="393" y="717">Key relationships</text>

  <rect class="box" x="635" y="635" width="220" height="100"/>
  <text class="box-title" x="658" y="668">Entity Profiles</text>
  <text class="box-text" x="658" y="695">Labels, URI aliases</text>
  <text class="box-text" x="658" y="717">Types and predicates</text>

  <rect class="box" x="900" y="635" width="300" height="100"/>
  <text class="box-title" x="923" y="668">Evaluation Assets</text>
  <text class="box-text" x="923" y="695">Benchmark, gold queries</text>
  <text class="box-text" x="923" y="717">ML model, error analysis</text>

  <path class="arrow" d="M280 208 L340 208"/>
  <path class="arrow" d="M590 208 L650 208"/>
  <path class="arrow" d="M910 208 L970 208"/>
  <path class="arrow" d="M1110 270 L1110 345"/>
  <path class="arrow" d="M970 408 L910 408"/>
  <path class="arrow dashed" d="M465 270 L465 345"/>
  <path class="arrow dashed" d="M745 635 L745 470"/>
  <path class="arrow dashed" d="M480 635 L480 270"/>
  <path class="arrow dashed" d="M215 635 L720 270"/>
</svg>

