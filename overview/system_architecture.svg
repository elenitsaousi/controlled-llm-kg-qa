<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="980" viewBox="0 0 1600 980">
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2,2 L10,6 L2,10 Z" fill="#334155"/>
    </marker>
    <style>
      text { font-family: Arial, Helvetica, sans-serif; fill: #16242a; }
      .title { font-size: 36px; font-weight: 700; }
      .sub { font-size: 18px; fill: #5d6f78; }
      .label { font-size: 13px; font-weight: 700; fill: #007f78; letter-spacing: .08em; text-transform: uppercase; }
      .box { fill: #ffffff; stroke: #cfdde3; stroke-width: 2; rx: 12; }
      .ui { fill: #edfafa; stroke: #19a99f; }
      .llm { fill: #fff7e8; stroke: #d79b35; }
      .ml { fill: #eef4ff; stroke: #5d82c7; }
      .kg { fill: #f3fbf5; stroke: #4d9d69; }
      .ops { fill: #f8fafc; stroke: #94a3b8; }
      .box-title { font-size: 19px; font-weight: 700; }
      .txt { font-size: 15px; fill: #465a63; }
      .tiny { font-size: 13px; fill: #667984; }
      .edge { stroke: #334155; stroke-width: 2.4; fill: none; marker-end: url(#arrow); }
      .soft-edge { stroke: #6b7f88; stroke-width: 2; fill: none; marker-end: url(#arrow); stroke-dasharray: 7 7; }
    </style>
  </defs>

  <rect width="1600" height="980" fill="#fbfcfe"/>
  <text class="label" x="70" y="48">Current implementation</text>
  <text class="title" x="70" y="88">True Demand KGQA System Architecture</text>
  <text class="sub" x="70" y="118">Controlled LLM-to-SPARQL question answering with Fuseki execution, ML selection, confidence routing, and clarification.</text>

  <rect class="box ui" x="70" y="175" width="250" height="150"/>
  <text class="box-title" x="100" y="215">Streamlit UI</text>
  <text class="txt" x="100" y="245">Natural-language question</text>
  <text class="txt" x="100" y="268">Example picker / builder</text>
  <text class="txt" x="100" y="291">Clarification choices</text>

  <rect class="box" x="380" y="175" width="250" height="150"/>
  <text class="box-title" x="410" y="215">Request Preparation</text>
  <text class="txt" x="410" y="245">Question normalization</text>
  <text class="txt" x="410" y="268">Entity/schema context</text>
  <text class="txt" x="410" y="291">Optional family routing</text>

  <rect class="box llm" x="690" y="175" width="270" height="150"/>
  <text class="box-title" x="720" y="215">Infineon GPT</text>
  <text class="txt" x="720" y="245">Prompt with compact schema</text>
  <text class="txt" x="720" y="268">Generate SPARQL candidates</text>
  <text class="txt" x="720" y="291">No direct answer from memory</text>

  <rect class="box ml" x="1020" y="175" width="280" height="150"/>
  <text class="box-title" x="1050" y="215">Candidate Selection</text>
  <text class="txt" x="1050" y="245">Schema/shape features</text>
  <text class="txt" x="1050" y="268">Logistic ML reranker</text>
  <text class="txt" x="1050" y="291">Safety guards</text>

  <rect class="box kg" x="690" y="410" width="270" height="150"/>
  <text class="box-title" x="720" y="450">Fuseki Execution</text>
  <text class="txt" x="720" y="480">Default SPARQL backend</text>
  <text class="txt" x="720" y="503">Full True Demand KG</text>
  <text class="txt" x="720" y="526">RDFLib fallback available</text>

  <rect class="box ui" x="1020" y="410" width="280" height="150"/>
  <text class="box-title" x="1050" y="450">Decision Routing</text>
  <text class="txt" x="1050" y="480">High confidence: answer</text>
  <text class="txt" x="1050" y="503">Low confidence: top-3 intents</text>
  <text class="txt" x="1050" y="526">Natural-language explanations</text>

  <rect class="box ui" x="380" y="410" width="250" height="150"/>
  <text class="box-title" x="410" y="450">Graph-Grounded Answer</text>
  <text class="txt" x="410" y="480">Executed query rows</text>
  <text class="txt" x="410" y="503">Natural-language summary</text>
  <text class="txt" x="410" y="526">Optional evidence graph</text>

  <rect class="box ops" x="70" y="410" width="250" height="150"/>
  <text class="box-title" x="100" y="450">App Operations</text>
  <text class="txt" x="100" y="480">System status panel</text>
  <text class="txt" x="100" y="503">Latency breakdown</text>
  <text class="txt" x="100" y="526">Session + feedback logs</text>

  <rect class="box kg" x="70" y="675" width="1230" height="185"/>
  <text class="box-title" x="100" y="715">Core Assets</text>

  <rect class="box" x="105" y="745" width="220" height="80"/>
  <text class="box-title" x="130" y="777">True Demand KG</text>
  <text class="tiny" x="130" y="803">RDF triples loaded in Fuseki</text>

  <rect class="box" x="365" y="745" width="220" height="80"/>
  <text class="box-title" x="390" y="777">Schema JSON</text>
  <text class="tiny" x="390" y="803">Classes, predicates, relations</text>

  <rect class="box" x="625" y="745" width="220" height="80"/>
  <text class="box-title" x="650" y="777">Ranker Model</text>
  <text class="tiny" x="650" y="803">Shape/scope/origin features</text>

  <rect class="box" x="885" y="745" width="220" height="80"/>
  <text class="box-title" x="910" y="777">Benchmark</text>
  <text class="tiny" x="910" y="803">1000 generated questions</text>

  <rect class="box" x="1145" y="745" width="120" height="80"/>
  <text class="box-title" x="1168" y="777">Reports</text>
  <text class="tiny" x="1168" y="803">Metrics</text>

  <path class="edge" d="M320 250 L380 250"/>
  <path class="edge" d="M630 250 L690 250"/>
  <path class="edge" d="M960 250 L1020 250"/>
  <path class="edge" d="M1160 325 L1160 410"/>
  <path class="edge" d="M1020 485 L960 485"/>
  <path class="edge" d="M690 485 L630 485"/>
  <path class="edge" d="M380 485 L320 485"/>

  <path class="soft-edge" d="M215 745 L720 560"/>
  <path class="soft-edge" d="M475 745 L505 325"/>
  <path class="soft-edge" d="M735 745 L1160 325"/>
  <path class="soft-edge" d="M995 745 L1160 560"/>
</svg>
