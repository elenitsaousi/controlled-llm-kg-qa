<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="500" viewBox="0 0 1080 500">
  <rect width="100%" height="100%" fill="white"/>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#14212b" flood-opacity="0.12"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#31424f"/>
    </marker>
  </defs>
  <style>
    .title{font:700 30px Arial, sans-serif; fill:#14212b}
    .sub{font:400 16px Arial, sans-serif; fill:#5f7280}
    .label{font:700 17px Arial, sans-serif; fill:#14212b}
    .small{font:400 14px Arial, sans-serif; fill:#5f7280}
    .step{font:800 18px Arial, sans-serif; fill:white}
    .cardtext{font:400 15px Arial, sans-serif; fill:#14212b}
    .tag{font:700 12px Arial, sans-serif; fill:white}
  </style>
<text x="58" y="58" class="title">User Entry Points in the UI</text>
<text x="58" y="86" class="sub">Users can ask freely, select validated examples, or construct graph-supported questions from controlled options.</text>
<rect x="70" y="135" width="450" height="92" rx="16" fill="#f7fbfa" stroke="#2f7de1" stroke-width="2.5" filter="url(#shadow)"/>
<circle cx="112" cy="181" r="21" fill="#2f7de1"/>
<text x="148" y="165" class="label">Free-text question</text>
<text x="148" y="188" class="small">Type any natural-language question.</text>
<text x="148" y="205" class="small">The router decides whether it is KG,</text>
<text x="148" y="222" class="small">ontology, advisory, or fallback.</text>
<rect x="580" y="135" width="450" height="92" rx="16" fill="#f7fbfa" stroke="#18a572" stroke-width="2.5" filter="url(#shadow)"/>
<circle cx="622" cy="181" r="21" fill="#18a572"/>
<text x="658" y="165" class="label">Validated examples</text>
<text x="658" y="188" class="small">Pre-tested questions that execute</text>
<text x="658" y="205" class="small">against the current graph and should</text>
<text x="658" y="222" class="small">return graph evidence.</text>
<rect x="70" y="253" width="450" height="92" rx="16" fill="#f7fbfa" stroke="#0f8f86" stroke-width="2.5" filter="url(#shadow)"/>
<circle cx="112" cy="299" r="21" fill="#0f8f86"/>
<text x="148" y="283" class="label">Guided builder</text>
<text x="148" y="306" class="small">Compose only supported paths:</text>
<text x="148" y="323" class="small">metric + dimension + aggregation +</text>
<text x="148" y="340" class="small">scope where available.</text>
<rect x="580" y="253" width="450" height="92" rx="16" fill="#f7fbfa" stroke="#f59e0b" stroke-width="2.5" filter="url(#shadow)"/>
<circle cx="622" cy="299" r="21" fill="#f59e0b"/>
<text x="658" y="283" class="label">Available topics</text>
<text x="658" y="306" class="small">Browse capabilities, metrics,</text>
<text x="658" y="323" class="small">dimensions, and graph-supported</text>
<text x="658" y="340" class="small">question families before asking.</text>
<rect x="70" y="371" width="450" height="92" rx="16" fill="#f7fbfa" stroke="#8b5cf6" stroke-width="2.5" filter="url(#shadow)"/>
<circle cx="112" cy="417" r="21" fill="#8b5cf6"/>
<text x="148" y="401" class="label">Digital Reference browser</text>
<text x="148" y="424" class="small">Search ontology terms and create</text>
<text x="148" y="441" class="small">deterministic definition questions</text>
<text x="148" y="458" class="small">without calling the LLM.</text>
<rect x="580" y="378" width="440" height="80" rx="16" fill="#eaf7f2" stroke="#9fd8c0"/>
<text x="604" y="407" class="label">Design principle</text>
<text x="604" y="431" class="small">Suggestions are graph-supported; free text is still possible,</text>
<text x="604" y="448" class="small">but ambiguous cases go through fallback or clarification.</text>
</svg>