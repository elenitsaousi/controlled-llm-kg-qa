<svg xmlns="http://www.w3.org/2000/svg" width="950" height="520" viewBox="0 0 950 520">
  <rect width="100%" height="100%" fill="white"/>
  <style>
    .title{font:700 26px Arial, sans-serif; fill:#14212b}
    .sub{font:400 14px Arial, sans-serif; fill:#5f7280}
    .label{font:600 14px Arial, sans-serif; fill:#14212b}
    .small{font:400 12px Arial, sans-serif; fill:#5f7280}
    .num{font:700 18px Arial, sans-serif; fill:#14212b}
  </style>
  <text x="60" y="60" class="title">Remaining Errors by Human SPARQL Difficulty</text>
<text x="60" y="88" class="sub">Difficulty estimates judge how hard it would be for a schema-aware human to write the correct SPARQL query.</text>
<rect x="120" y="160" width="160" height="260" rx="12" fill="#f1f6f6" stroke="#d9e5e8"/>
<rect x="120" y="390.2857142857143" width="160" height="29.714285714285715" rx="12" fill="#ef4444"/>
<text x="200.0" y="378.2857142857143" text-anchor="middle" class="num">8</text>
<text x="200.0" y="458" text-anchor="middle" class="label">Easy</text>
<rect x="375" y="160" width="160" height="260" rx="12" fill="#f1f6f6" stroke="#d9e5e8"/>
<rect x="375" y="342.0" width="160" height="78.0" rx="12" fill="#f59e0b"/>
<text x="455.0" y="330.0" text-anchor="middle" class="num">21</text>
<text x="455.0" y="458" text-anchor="middle" class="label">Medium</text>
<rect x="630" y="160" width="160" height="260" rx="12" fill="#f1f6f6" stroke="#d9e5e8"/>
<rect x="630" y="186.0" width="160" height="234.0" rx="12" fill="#2f7de1"/>
<text x="710.0" y="174.0" text-anchor="middle" class="num">63</text>
<text x="710.0" y="458" text-anchor="middle" class="label">Hard</text>
<text x="95" y="490" class="small">Takeaway: most remaining failures are complex schema-dependent query families, not simple natural-language misses.</text>
</svg>