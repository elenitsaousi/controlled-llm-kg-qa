<svg xmlns="http://www.w3.org/2000/svg" width="1420" height="540" viewBox="0 0 1420 540">
  <rect width="100%" height="100%" fill="white"/>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#14212b" flood-opacity="0.12"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#31424f"/>
    </marker>
  </defs>
  <style>
    .title{font:700 30px Arial, sans-serif; fill:#14212b}
    .sub{font:400 16px Arial, sans-serif; fill:#5f7280}
    .label{font:700 17px Arial, sans-serif; fill:#14212b}
    .small{font:400 14px Arial, sans-serif; fill:#5f7280}
    .step{font:800 18px Arial, sans-serif; fill:white}
    .cardtext{font:400 15px Arial, sans-serif; fill:#14212b}
    .tag{font:700 12px Arial, sans-serif; fill:white}
  </style>
<text x="58" y="58" class="title">Hybrid Routing Flow</text>
<text x="58" y="86" class="sub">The system answers deterministically when a trusted path exists and uses the LLM only for unresolved or ambiguous requests.</text>
<rect x="70" y="145" width="215" height="105" rx="16" fill="#f7fbfa" stroke="#cfe1e5" stroke-width="1.5" filter="url(#shadow)"/>
<rect x="70" y="145" width="215" height="32" rx="16" fill="#18a572"/>
<text x="86" y="167" class="step">1</text>
<text x="124" y="167" font-family="Arial" font-size="16" font-weight="800" fill="white">Streamlit UI</text>
<text x="88" y="203" class="cardtext">Free text, examples, builder,</text>
<text x="88" y="222" class="cardtext">DR browser, evidence graph</text>
<rect x="345" y="145" width="215" height="105" rx="16" fill="#f7fbfa" stroke="#cfe1e5" stroke-width="1.5" filter="url(#shadow)"/>
<rect x="345" y="145" width="215" height="32" rx="16" fill="#0f8f86"/>
<text x="361" y="167" class="step">2</text>
<text x="399" y="167" font-family="Arial" font-size="16" font-weight="800" fill="white">Request Router</text>
<text x="363" y="203" class="cardtext">Classifies request type:</text>
<text x="363" y="222" class="cardtext">KG, DR, advisory, fallback</text>
<rect x="620" y="145" width="215" height="105" rx="16" fill="#f7fbfa" stroke="#cfe1e5" stroke-width="1.5" filter="url(#shadow)"/>
<rect x="620" y="145" width="215" height="32" rx="16" fill="#18a572"/>
<text x="636" y="167" class="step">3A</text>
<text x="674" y="167" font-family="Arial" font-size="16" font-weight="800" fill="white">Deterministic Route</text>
<text x="638" y="203" class="cardtext">Exact ontology / KG / advisory</text>
<text x="638" y="222" class="cardtext">path is known and supported</text>
<rect x="620" y="330" width="215" height="105" rx="16" fill="#f7fbfa" stroke="#cfe1e5" stroke-width="1.5" filter="url(#shadow)"/>
<rect x="620" y="330" width="215" height="32" rx="16" fill="#2f7de1"/>
<text x="636" y="352" class="step">3B</text>
<text x="674" y="352" font-family="Arial" font-size="16" font-weight="800" fill="white">LLM Fallback</text>
<text x="638" y="388" class="cardtext">Only if unsupported, unsafe,</text>
<text x="638" y="407" class="cardtext">empty, or genuinely ambiguous</text>
<rect x="895" y="145" width="215" height="105" rx="16" fill="#f7fbfa" stroke="#cfe1e5" stroke-width="1.5" filter="url(#shadow)"/>
<rect x="895" y="145" width="215" height="32" rx="16" fill="#18a572"/>
<text x="911" y="167" class="step">4A</text>
<text x="949" y="167" font-family="Arial" font-size="16" font-weight="800" fill="white">Direct Answer</text>
<text x="913" y="203" class="cardtext">Execute checked route;</text>
<text x="913" y="222" class="cardtext">skip LLM call</text>
<rect x="895" y="330" width="215" height="105" rx="16" fill="#f7fbfa" stroke="#cfe1e5" stroke-width="1.5" filter="url(#shadow)"/>
<rect x="895" y="330" width="215" height="32" rx="16" fill="#f59e0b"/>
<text x="911" y="352" class="step">4B</text>
<text x="949" y="352" font-family="Arial" font-size="16" font-weight="800" fill="white">Validation + ML</text>
<text x="913" y="388" class="cardtext">Validate candidates, rerank,</text>
<text x="913" y="407" class="cardtext">then route by confidence</text>
<rect x="1170" y="238" width="215" height="105" rx="16" fill="#f7fbfa" stroke="#cfe1e5" stroke-width="1.5" filter="url(#shadow)"/>
<rect x="1170" y="238" width="215" height="32" rx="16" fill="#0f8f86"/>
<text x="1186" y="260" class="step">5</text>
<text x="1224" y="260" font-family="Arial" font-size="16" font-weight="800" fill="white">Final Output</text>
<text x="1188" y="296" class="cardtext">Answer, clarification, no-answer,</text>
<text x="1188" y="315" class="cardtext">evidence graph and audit log</text>
<line x1="285" y1="197" x2="340" y2="197" stroke="#31424f" stroke-width="2.4" marker-end="url(#arrow)"/>
<rect x="254.5" y="173.0" width="116" height="20" rx="10" fill="white" opacity="0.92"/>
<text x="312.5" y="187.0" text-anchor="middle" class="small">question</text>
<line x1="560" y1="197" x2="615" y2="197" stroke="#31424f" stroke-width="2.4" marker-end="url(#arrow)"/>
<rect x="529.5" y="173.0" width="116" height="20" rx="10" fill="white" opacity="0.92"/>
<text x="587.5" y="187.0" text-anchor="middle" class="small">classified</text>
<line x1="835" y1="197" x2="890" y2="197" stroke="#31424f" stroke-width="2.4" marker-end="url(#arrow)"/>
<rect x="804.5" y="173.0" width="116" height="20" rx="10" fill="white" opacity="0.92"/>
<text x="862.5" y="187.0" text-anchor="middle" class="small">exact</text>
<line x1="835" y1="382" x2="890" y2="382" stroke="#31424f" stroke-width="2.4" marker-end="url(#arrow)"/>
<rect x="804.5" y="358.0" width="116" height="20" rx="10" fill="white" opacity="0.92"/>
<text x="862.5" y="372.0" text-anchor="middle" class="small">candidates</text>
<line x1="1110" y1="197" x2="1165" y2="270" stroke="#31424f" stroke-width="2.4" marker-end="url(#arrow)"/>
<rect x="1079.5" y="209.5" width="116" height="20" rx="10" fill="white" opacity="0.92"/>
<text x="1137.5" y="223.5" text-anchor="middle" class="small">deterministic answer</text>
<line x1="1110" y1="382" x2="1165" y2="310" stroke="#31424f" stroke-width="2.4" marker-end="url(#arrow)"/>
<rect x="1079.5" y="322.0" width="116" height="20" rx="10" fill="white" opacity="0.92"/>
<text x="1137.5" y="336.0" text-anchor="middle" class="small">ranked / clarify</text>
<line x1="728" y1="250" x2="728" y2="325" stroke="#31424f" stroke-width="2.4" marker-end="url(#arrow)"/>
<rect x="670.0" y="263.5" width="116" height="20" rx="10" fill="white" opacity="0.92"/>
<text x="728.0" y="277.5" text-anchor="middle" class="small">fallback needed</text>
<rect x="60" y="275" width="500" height="54" rx="14" fill="#eaf7f2" stroke="#9fd8c0"/>
<text x="82" y="298" class="label">Deterministic path first</text>
<text x="82" y="318" class="small">DR lookup, KG templates, and advisory templates are alternatives selected by the router.</text>
<rect x="60" y="460" width="1295" height="42" rx="12" fill="#f7fbfa" stroke="#9fd8c0"/>
<text x="82" y="486" class="small">Stored assets: schema.json | capability inventory | DigitalReference.ttl | validated examples | ranker model | audit logs</text>
</svg>